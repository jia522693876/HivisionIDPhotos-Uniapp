# 设置工作进程数为 CPU 核心数
worker_processes 2; 

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
#	# 设置每个工作进程的最大连接数
    worker_connections  102400;
}


http {
	proxy_cache_path temp levels=1:2 keys_zone=my_cache:10m max_size=2g inactive=20m;
	#这样可以确保即使是相同的URI，由于请求方式的不同（如分片下载），也能生成不同的缓存键，从而避免缓存冲突
	proxy_cache_key $http_range$uri; 


    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/access.log  main;
	error_log  /var/log/error.log;

    sendfile        on;
    tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  lianpujt.com *.lianpujt.com;
		
		fastcgi_param SERVER_NAME $host;
		
        #charset koi8-r;

        #access_log  logs/host.access.log  main;
		
		index index.html;
		
		# 配置静态资源的访问路径和实际存储路径
		location / {
			alias /var/www/web_main/;
			#浏览器缓存
			expires 365d;
			#location ~ \.(jpg|jpeg|png|gif)$ {}
			access_log off;
			proxy_cache my_cache;
			proxy_cache_valid 200 302 10h;
			proxy_cache_valid 404 10m;
		}

        location /mz/ {
            alias /var/www/dist/build/web/;
			#浏览器缓存
			expires 365d;
			access_log off;
			proxy_cache my_cache;
			proxy_cache_valid 200 302 10h;
			proxy_cache_valid 404 10m;
        }
		location /static/ {
            alias /var/www/dist/build/web/static/;
			#浏览器缓存
			expires 365d;
			access_log off;
			proxy_cache my_cache;
			proxy_cache_valid 200 302 10h;
			proxy_cache_valid 404 10m;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
	
	upstream my_service {
		server 192.168.1.51:9842 weight=2 max_fails=0 fail_timeout=10s; 
		server 192.168.1.51:9841 max_fails=0 fail_timeout=10s;
		#max_conns 2000;
		#queue 1000 timeout=5s;
		keepalive 10; 
	}
	
	server {
        listen       9191;
        server_name  *.lianpujt.com;
		
		keepalive_timeout  120;
		keepalive_requests 500;
		
		fastcgi_param SERVER_NAME $host;
		
        #charset koi8-r;

        #access_log  logs/host.access.log  main;
		
		

		location / { 
			proxy_pass http://my_service; 
			proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
			proxy_http_version 1.1;
			proxy_set_header Connection "keep-alive";
		}
		

        

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
